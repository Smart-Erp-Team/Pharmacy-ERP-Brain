version: '3.8'

services:
  # Mock server for Frontend and AI teams to start immediately without waiting for Backend
  mocks:
    image: clue/json-server
    ports:
      - "8080:80"
    volumes:
      # Mount the fixtures directory to serve the mock JSON data
      - ../contracts/fixtures/db.json:/data/db.json

  # ERP System of Record Database (PostgreSQL)
  erp_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"

  # AI Brain Derived Intelligence Database (PostgreSQL)
  brain_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: brain_db
    ports:
      - "5433:5432"

  # Event bus and cache for the MVP
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # AI Brain HTTP service
  brain_api:
    build:
      context: ../apps/brain
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
