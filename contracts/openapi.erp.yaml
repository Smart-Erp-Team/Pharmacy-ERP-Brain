components:
  schemas:
    AddressDto:
      required:
      - city
      - country_code
      - line1
      type: object
      properties:
        line1:
          maxLength: 200
          minLength: 1
          type: string
        line2:
          maxLength: 200
          minLength: 0
          type: string
          nullable: true
        city:
          maxLength: 100
          minLength: 1
          type: string
        region:
          maxLength: 100
          minLength: 0
          type: string
          nullable: true
        postal_code:
          maxLength: 20
          minLength: 0
          type: string
          nullable: true
        country_code:
          maxLength: 2
          minLength: 2
          type: string
      additionalProperties: false
    ApiErrorBodyDto:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetailDto'
        trace_id:
          type: string
      additionalProperties: false
    ApiErrorDetailDto:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
      additionalProperties: false
    ApiErrorEnvelopeDto:
      type: object
      properties:
        error:
          allOf:
          - $ref: '#/components/schemas/ApiErrorBodyDto'
      additionalProperties: false
    BatchQualityStatus:
      enum:
      - AVAILABLE
      - QUARANTINED
      - EXPIRED
      - RECALLED
      type: string
    BranchDto:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        branch_code:
          type: string
        name:
          type: string
        address:
          allOf:
          - $ref: '#/components/schemas/AddressDto'
        is_active:
